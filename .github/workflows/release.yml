name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate release version
        run: python scripts/validate_repo.py --skill simplified-technical-language --tag "$GITHUB_REF_NAME"

      - name: Run checker self-tests
        run: python simplified-technical-language/scripts/check_writing.py --selftest

      - name: Build installable ZIP
        run: |
          mkdir -p dist
          zip -r dist/simplified-technical-language.zip simplified-technical-language \
            -x "*/__pycache__/*" "*.pyc" "*.DS_Store"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "Simplified Technical Language $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
